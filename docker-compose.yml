services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
    environment:
      REDIS_HOST: redis
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  db:
    image: postgres:15-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file:
      - ./docker.env
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  collector:
    build:
      context: .
      dockerfile: collector-c/Dockerfile
    depends_on:
      - backend
    command: ["--url", "http://backend:8000", "--interval", "5"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  test:
    build:
      context: .
      dockerfile: backend/Dockerfile.dev
    env_file:
      - ./docker.env
    volumes:
      - ./backend:/app
    depends_on:
      - db

volumes:
  postgres_data:
