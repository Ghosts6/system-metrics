services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - ./docker.env
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  db:
    image: postgres:15-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file:
      - ./docker.env
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "PING"]
      interval: 1s
      timeout: 3s
      retries: 5

  collector:
    build:
      context: .
      dockerfile: collector-c/Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    command: ["-u", "http://backend:8000", "-i", "5", "-P", "-A", "INFO"]
    # Uncomment the 'deploy' section below to enable NVIDIA GPU monitoring.
    # Requires the NVIDIA Container Toolkit to be installed on the host system (Linux only).
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  test:
    build:
      context: .
      dockerfile: backend/Dockerfile.dev
    env_file:
      - ./docker.env
    volumes:
      - ./backend:/app
    depends_on:
      - db

volumes:
  postgres_data:
