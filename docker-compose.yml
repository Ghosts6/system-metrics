services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
    env_file:
      - ./docker.env
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  db:
    image: postgres:15-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file:
      - ./docker.env
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  collector:
    build:
      context: .
      dockerfile: collector-c/Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    command: ["--url", "http://backend:8000", "--interval", "5"]
    # Uncomment the 'deploy' section below to enable NVIDIA GPU monitoring.
    # Requires the NVIDIA Container Toolkit to be installed on the host system (Linux only).
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  test:
    build:
      context: .
      dockerfile: backend/Dockerfile.dev
    env_file:
      - ./docker.env
    volumes:
      - ./backend:/app
    depends_on:
      - db

volumes:
  postgres_data:
