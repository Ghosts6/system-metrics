name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Create docker.env file
      run: |
        cat > docker.env << EOF
        POSTGRES_DB=system_metrics
        POSTGRES_USER=user
        POSTGRES_PASSWORD=password
        DATABASE_URL=postgresql://user:password@db:5432/system_metrics
        REDIS_HOST=redis
        REDIS_PORT=6379
        SECRET_KEY=test-secret-key-for-ci
        EOF
    
    - name: Build and start services
      run: |
        docker compose up -d db redis
        sleep 5
    
    - name: Run tests
      run: |
        docker compose run --rm test pytest -v --tb=short -W ignore::PendingDeprecationWarning
    
    - name: Cleanup
      if: always()
      run: |
        docker compose down -v

  build-collector:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies (Linux)
      if: runner.os == 'Linux'
      run: sudo apt-get update && sudo apt-get install -y build-essential libcurl4-openssl-dev

    - name: Install dependencies (macOS)
      if: runner.os == 'macOS'
      run: brew install curl

    - name: Cache Chocolatey packages
      if: runner.os == 'Windows'
      uses: actions/cache@v3
      with:
        path: C:\ProgramData\chocolatey\lib
        key: ${{ runner.os }}-choco-${{ hashFiles('**/.github/workflows/ci.yml') }}
        restore-keys: |
          ${{ runner.os }}-choco-

    - name: Install MinGW (Windows)
      if: runner.os == 'Windows'
      run: |
        choco install mingw --version=11.2.0.07112021 -y
        echo "C:\ProgramData\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

    - name: Install curl and set paths (Windows)
      if: runner.os == 'Windows'
      id: curl-paths
      run: |
        choco install curl
        $CURL_DIR = (Get-ChildItem -Path "C:\ProgramData\chocolatey\lib\curl\tools\curl-*-win64-mingw").FullName
        $CURL_INCLUDE_PATH = Join-Path $CURL_DIR "include"
        $CURL_LIB_PATH = Join-Path $CURL_DIR "lib"
        echo "include_path=$CURL_INCLUDE_PATH" >> $env:GITHUB_OUTPUT
        echo "lib_path=$CURL_LIB_PATH" >> $env:GITHUB_OUTPUT

    - name: Build collector (Linux/macOS)
      if: runner.os != 'Windows'
      run: make -C collector-c

    - name: Build collector (Windows)
      if: runner.os == 'Windows'
      run: mingw32-make -f Makefile.win -C collector-c "CFLAGS=-Wall -Wextra -std=c11 -O2 -I${{ steps.curl-paths.outputs.include_path }}" "LDFLAGS=-L${{ steps.curl-paths.outputs.lib_path }} -lcurl -lpdh -liphlpapi -lpsapi -lws2_32"

  build-client:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install Qt dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y qt6-base-dev qt6-charts-dev cmake build-essential

    - name: Configure and build Qt client
      run: |
        cd client
        cmake -B build
        cmake --build build
